name: Verify

# 为什么要这个文件：改版本号、删导出、加一个没跑过的迁移——这些错误在开发机上没人挡，
# 一次 push 到 main 之后就只能靠别人在浏览器里发现。这里把开发机的四道门（单测、
# 元数据/类型/lint/构建、依赖审计）搬到每次 push 和每个 PR 上。
#
# 明确不跑 e2e：scripts/run-e2e.mjs 需要 headed Chrome + 真实 Supabase 凭据，
# 还会往线上库写测试账号（见该文件头部注释），放进 CI 等于用生产数据做冒烟。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 单测 / 类型 / lint / 构建 / 依赖审计
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 不传 version：action 会自动读 package.json 的 packageManager（pnpm@10.24.0），
      # 升级 pnpm 时只改一处，CI 自动跟上，不会出现本地 10.x / CI 9.x 的行为差。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 22：与 @types/node ^22 一致，且 --experimental-strip-types 需要 ≥22.6。
          node-version: 22
          cache: pnpm

      - name: 安装依赖（锁文件必须与 package.json 一致）
        run: pnpm install --frozen-lockfile

      # ── Postgres：不是给测试用的服务，是给 opStampGuard.pg.test.ts 用的二进制 ──
      # 该文件用 initdb/pg_ctl/psql 自己拉起一个临时库。三个二进制缺任意一个，
      # PG_AVAILABLE 就是 false，整组 10 个用例会被 { skip } 静默跳过——一次历史
      # 上出过两次事故的守卫，会在一片全绿里变成一片空洞。所以这里不仅要装，
      # 还要在下一步显式验证装上了。
      - uses: supercharge/setup-postgres@v1
        with:
          postgresql-version: 16

      - name: 校验 initdb/pg_ctl/psql 真的可用（缺了就必须红，不许静默跳过）
        shell: bash
        run: |
          set -euo pipefail
          # setup-postgres 的安装目录随版本/镜像而变（本地实测、runner 镜像、pg_config 都可能），
          # 逐个探测后追加到 PATH；既补上后继步骤，也补上本步骤后面的探测。
          candidates=(
            "${RUNNER_TEMP:-/tmp}/postgresql/bin"
            /usr/local/opt/postgresql@16/bin
            /usr/lib/postgresql/16/bin
          )
          if command -v pg_config >/dev/null 2>&1; then
            candidates+=("$(pg_config --bindir)")
          fi
          for d in "${candidates[@]}"; do
            if [ -d "$d" ]; then
              echo "found postgres bin dir: $d"
              export PATH="$PATH:$d"
              # GITHUB_PATH 在 GitHub runner 上恒存在；本地复跑这一步时跳过，
              # 这样这段脚本不必只能在 CI 里验证。
              if [ -n "${GITHUB_PATH:-}" ]; then
                echo "$d" >> "$GITHUB_PATH"
              fi
            fi
          done
          missing=()
          for b in initdb pg_ctl psql; do
            command -v "$b" >/dev/null 2>&1 || missing+=("$b")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::缺少 PostgreSQL 二进制：${missing[*]} —— tests/opStampGuard.pg.test.ts 会整组静默 skip，门禁形同虚设"
            echo "如果 supercharge/setup-postgres 在当前 runner 镜像上不产出可用二进制，请改为显式安装，例如："
            echo "  sudo apt-get update && sudo apt-get install -y postgresql-16"
            exit 1
          fi
          initdb --version && pg_ctl --version && psql --version

      - name: 单测（含真实 Postgres 触发器集成测试）
        run: pnpm test

      - name: 元数据一致性 + 类型 + lint + 构建
        run: pnpm validate

      # pnpm audit 必须显式指定 registry：本机/部分环境默认走 npmmirror，
      # 而它没有实现 audit 端点，直接跑会 ERR_PNPM_AUDIT_ENDPOINT_NOT_EXISTS。
      - name: 依赖安全审计
        run: pnpm audit --config.registry=https://registry.npmjs.org/

      # 测试代码的类型检查与 lint 已由 `pnpm validate` 覆盖（见 package.json 的
      # validate 脚本），且当前均为 0 错误 —— 不在这里重复跑一遍。
      # 曾经把它们挂在下面并标 continue-on-error「债务可见中」，那是引入当时
      # 99 + 8 个错误的临时状态；债清零后那两条既不会红、也不会单独报出任何
      # 东西，只会让看 CI 的人以为 tests 仍未纳入门禁。
