name: Verify

# 这个工作流是谁在用、为什么从自动改成手动（2026-10-06）：
#
#   引入于 dff8582「hardening: 修掉一批会丢用户数据的同步缺陷 + 建立真正的门禁」，
#   当时的场景是「改版本号、删导出、加一个没跑过的迁移——这些错误在开发机上没人挡，
#   一次 push 到 main 之后就只能靠别人在浏览器里发现」。
#
#   但仓库实测下来：远端只有 main 一个分支、近 20 个提交全部同一作者、
#   历史 8 个 PR 都是自己开自己合（见 gh pr list --state all）。也就是说
#   「PR 评审」这个它本来最有用的场景，从来没有发生过。
#
#   而它唯一剩下的作用是「每次 push 强制替我跑一遍门禁」——这件事本机
#   `pnpm test`（约 15 秒）+ `pnpm validate` 已经覆盖得更好：更快、报错更直接、
#   不受 runner 配额与网络影响。作为一个单人项目，这是纯粹的仪式性开销。
#
#   所以触发器从 push 降级为**手动**：想跑的时候 `gh workflow run verify.yml`，
#   不用每次推送都等一遍。**没有删除这个文件** —— 它记录了「发布前应该跑哪四道门」，
#   删掉之后新人（和未来的我）就没有那份清单了。
#
#   ⚠️ 这次降级本身也印证了它的价值：就在改这个配置之前，CI 抓出了
#      `pnpm-lock.yaml` 与 `package.json` 不同步（瘦身删了 5 个依赖却没更新
#      lockfile，本机 node_modules 已存在所以毫无察觉）。这个错误只有
#      「干净环境装一次依赖」才暴露 —— 本机永远发现不了。
#
# 明确不跑 e2e：scripts/run-e2e.mjs 需要 headed Chrome + 真实 Supabase 凭据，
# 还会往线上库写测试账号（见该文件头部注释），放进 CI 等于用生产数据做冒烟。

on:
  # 只保留手动触发 + PR。push 到 main 不再自动跑（见上方原因）。
  # PR 保留是因为万一将来真有人开分支，评审前跑一遍仍是应该的。
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 单测 / 类型 / lint / 构建 / 依赖审计
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 不传 version：action 会自动读 package.json 的 packageManager（pnpm@10.24.0），
      # 升级 pnpm 时只改一处，CI 自动跟上，不会出现本地 10.x / CI 9.x 的行为差。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 22：与 @types/node ^22 一致，且 --experimental-strip-types 需要 ≥22.6。
          node-version: 22
          cache: pnpm

      - name: 安装依赖（锁文件必须与 package.json 一致）
        run: pnpm install --frozen-lockfile

      # ── Postgres：不是给测试用的服务，是给 opStampGuard.pg.test.ts 用的二进制 ──
      # 该文件用 initdb/pg_ctl/psql 自己拉起一个临时库。三个二进制缺任意一个，
      # PG_AVAILABLE 就是 false，整组 10 个用例会被 { skip } 静默跳过——一次历史
      # 上出过两次事故的守卫，会在一片全绿里变成一片空洞。所以这里不仅要装，
      # 还要在下一步显式验证装上了。
      # 2026-10-02：原 supercharge/setup-postgres@v1 的仓库已从 GitHub 下架
      # （action 解析失败，CI 在 Set up job 就红 5s，单测一次都没跑过）。
      # 改为在 ubuntu-24.04 runner 上显式 apt 安装 postgresql-16：来源是 runner
      # 镜像自带 apt，不再依赖任何第三方 action 的存活。
      - name: 安装 PostgreSQL 16 二进制
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16

      - name: 校验 initdb/pg_ctl/psql 真的可用（缺了就必须红，不许静默跳过）
        shell: bash
        run: |
          set -euo pipefail
          # setup-postgres 的安装目录随版本/镜像而变（本地实测、runner 镜像、pg_config 都可能），
          # 逐个探测后追加到 PATH；既补上后继步骤，也补上本步骤后面的探测。
          candidates=(
            "${RUNNER_TEMP:-/tmp}/postgresql/bin"
            /usr/local/opt/postgresql@16/bin
            /usr/lib/postgresql/16/bin
          )
          if command -v pg_config >/dev/null 2>&1; then
            candidates+=("$(pg_config --bindir)")
          fi
          for d in "${candidates[@]}"; do
            if [ -d "$d" ]; then
              echo "found postgres bin dir: $d"
              export PATH="$PATH:$d"
              # GITHUB_PATH 在 GitHub runner 上恒存在；本地复跑这一步时跳过，
              # 这样这段脚本不必只能在 CI 里验证。
              if [ -n "${GITHUB_PATH:-}" ]; then
                echo "$d" >> "$GITHUB_PATH"
              fi
            fi
          done
          missing=()
          for b in initdb pg_ctl psql; do
            command -v "$b" >/dev/null 2>&1 || missing+=("$b")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::缺少 PostgreSQL 二进制：${missing[*]} —— tests/opStampGuard.pg.test.ts 会整组静默 skip，门禁形同虚设"
            echo "上一步 apt 安装的 postgresql-16 二进制没进 PATH：检查安装步骤输出与 runner 镜像变更。"
            exit 1
          fi
          initdb --version && pg_ctl --version && psql --version

      - name: 单测（含真实 Postgres 触发器集成测试）
        run: pnpm test

      - name: 元数据一致性 + 类型 + lint + 构建 + 首屏体积门
        run: pnpm validate

      # 首屏体积门已串进 validate（pnpm check:bundle），这里单独再跑一次只为让
      # CI 日志里出现那张逐文件清单 —— 超预算时 validate 会红，但那时日志里
      # 混着类型/lint 输出，具体是哪几个 chunk 变肥了不好找。
      #
      # 为什么值得有一个真会红的门：docs/v2-plan.md 曾承诺「超预算阻断发布」，
      # 而原 report-y-bundle.mjs 超了只打印 ALERT 并 exit 0，且从未被任何地方
      # 调用 —— 一个没人调、也不拦人的门不是门。现已改写为测「用户点开弹窗时
      # 必须下载的全部资源」，超预算 exit 1。
      - name: popup 首屏体积门（逐文件清单）
        run: pnpm check:bundle

      # 【为什么只审生产依赖（--prod）】扩展发布的是 vite 打出来的 bundle，
      # devDependencies 只在 lint/构建期用，一个字节都不进 dist。
      # 全量审计会拿 dev 链路的漏洞把门禁染红，而这些漏洞对用户零暴露：
      # 现状就是 braces <=3.0.3（GHSA-vfj7-8cjw-p6xm，栈耗尽 DoS）经
      # @typescript-eslint → … → micromatch 引入，纯 dev 链路；我已核对 dist/ 里
      # 搜不到 braces。且该 advisory 的 Patched versions 为 <0.0.0 —— npm 上
      # braces 最新就是 3.0.3，上游暂无可升级的修复版本，升级这条路当前不通。
      # 门禁长期常红会让人对 CI 脱敏（比这个 dev 漏洞本身更危险），所以按
      # 「审真正出货的东西」收口。dev 链路要单独看时，手动跑 pnpm audit 即可。
      #
      # pnpm audit 必须显式指定 registry：本机/部分环境默认走 npmmirror，
      # 而它没有实现 audit 端点，直接跑会 ERR_PNPM_AUDIT_ENDPOINT_NOT_EXISTS。
      - name: 依赖安全审计（仅生产依赖）
        run: pnpm audit --prod --config.registry=https://registry.npmjs.org/

      # 测试代码的类型检查与 lint 已由 `pnpm validate` 覆盖（见 package.json 的
      # validate 脚本），且当前均为 0 错误 —— 不在这里重复跑一遍。
      # 曾经把它们挂在下面并标 continue-on-error「债务可见中」，那是引入当时
      # 99 + 8 个错误的临时状态；债清零后那两条既不会红、也不会单独报出任何
      # 东西，只会让看 CI 的人以为 tests 仍未纳入门禁。
